name: Finalize Workhorse v86 regression guards

on:
  push:
    paths:
      - '.github/workflows/apply-v86.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update permanent validation guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          validate = Path('.github/workflows/validate.yml')
          text = validate.read_text(encoding='utf-8')
          text = text.replace('./new-user-adp-v60.js?v=606', './new-user-adp-v60.js?v=607')
          text = text.replace('./decision-loader-v61.js?v=636', './decision-loader-v61.js?v=637')

          anchor = """          cloud = Path('cloud-reliability-v41.js').read_text(encoding='utf-8')\n"""
          guard = """          # Rankings/Edge invariants: keep the fast default board at 250 without shrinking manual player access.\n          central = Path('central-adp-v36.js').read_text(encoding='utf-8')\n          for term in [\n              'const AUTO_RANK_LIMIT=250;',\n              'const DIRECTORY_LIMIT=500;',\n              'try{sleeperPool=pool}',\n          ]:\n              if term not in central:\n                  raise SystemExit(f'Player-load/search invariant missing: {term}')\n          if 'const STARTER_LIMIT=250;' not in starter:\n              raise SystemExit('Starter ranking limit must remain 250')\n\n          edge = Path('live-draft-edge-v82.js').read_text(encoding='utf-8')\n          if 'edge:sleeper-mine' not in edge:\n              raise SystemExit('My Edge sign/formula changed unexpectedly')\n          if 'm?.searchRank' in edge or 'Sleeper live player rank' in edge:\n              raise SystemExit('My Edge must use true Sleeper ADP only, never search rank')\n\n          market_patch = Path('patch-v29.js').read_text(encoding='utf-8')\n          if 'data-market-add' not in market_patch:\n              raise SystemExit('Manual Add Player path is missing')\n          id_pos = market_patch.find('if(sleeperId){')\n          name_pos = market_patch.find('if(name&&market[name])')\n          if id_pos < 0 or name_pos < 0 or id_pos > name_pos:\n              raise SystemExit('Sleeper ID matching must remain ahead of name matching')\n\n"""
          if guard not in text:
              if anchor not in text:
                  raise SystemExit('Could not find permanent validation insertion point')
              text = text.replace(anchor, guard + anchor, 1)
          validate.write_text(text, encoding='utf-8')

          # Keep NR wording consistent with the new ADP-only Edge behavior.
          replace_exact(
              'live-draft-edge-v82.js',
              'Sleeper does not currently have a usable ADP or live rank for this player.',
              'Sleeper does not currently have a usable ADP for this player.'
          )

          # Verify the permanent guards themselves before committing.
          v = validate.read_text(encoding='utf-8')
          for term in [
              './new-user-adp-v60.js?v=607',
              './decision-loader-v61.js?v=637',
              'const AUTO_RANK_LIMIT=250;',
              'const STARTER_LIMIT=250;',
              "if 'm?.searchRank' in edge or 'Sleeper live player rank' in edge:",
              "if 'data-market-add' not in market_patch:",
          ]:
              if term not in v:
                  raise SystemExit(f'Permanent regression guard missing: {term}')
          PY

      - name: Run targeted regression checks
        shell: bash
        run: |
          node --check patch-v29.js
          node --check central-adp-v36.js
          node --check new-user-adp-v60.js
          node --check live-draft-edge-v82.js
          node --check decision-loader-v61.js
          python - <<'PY'
          from pathlib import Path
          central=Path('central-adp-v36.js').read_text()
          starter=Path('new-user-adp-v60.js').read_text()
          edge=Path('live-draft-edge-v82.js').read_text()
          patch=Path('patch-v29.js').read_text()
          index=Path('index.html').read_text()
          assert 'const AUTO_RANK_LIMIT=250;' in central
          assert 'const DIRECTORY_LIMIT=500;' in central
          assert 'try{sleeperPool=pool}' in central
          assert 'const STARTER_LIMIT=250;' in starter
          assert 'edge:sleeper-mine' in edge
          assert 'm?.searchRank' not in edge
          assert 'Sleeper live player rank' not in edge
          assert 'data-market-add' in patch
          assert patch.find('if(sleeperId){') < patch.find('if(name&&market[name])')
          assert 'Math.min(3,files.length)' in index
          PY
          git diff --check

      - name: Commit permanent guards and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate.yml live-draft-edge-v82.js
          git rm .github/workflows/apply-v86.yml
          git commit -m 'Guard Edge accuracy and 250-player loading'
          git push
