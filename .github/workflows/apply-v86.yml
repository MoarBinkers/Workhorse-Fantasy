name: Apply Workhorse v86 stability patch

on:
  push:
    paths:
      - '.github/workflows/apply-v86.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted stability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          # Default/starter ranking depth: 250. Keep the larger Sleeper directory/search pool intact.
          replace_exact('central-adp-v36.js', 'const AUTO_RANK_LIMIT=300;', 'const AUTO_RANK_LIMIT=250;')
          replace_exact('new-user-adp-v60.js', 'const STARTER_LIMIT=300;', 'const STARTER_LIMIT=250;')

          # Prefer stable Sleeper player IDs before names so Edge/market data cannot attach to the wrong player.
          replace_exact(
              'patch-v29.js',
              '''  function marketMatch(value){\n    const name=typeof value==="string"?value:value?.name;\n    const sleeperId=typeof value==="object"?(value?.sleeperId||value?.id):null;\n    if(name&&market[name])return {name,entry:market[name]};\n    const n=norm(name);\n    for(const [key,entry] of Object.entries(market)){\n      if(!entry||typeof entry!=="object")continue;\n      if(sleeperId&&entry.id&&String(entry.id)===String(sleeperId))return {name:key,entry};\n      if(n&&norm(key)===n)return {name:key,entry};\n    }\n    return null;\n  }''',
              '''  function marketMatch(value){\n    const name=typeof value==="string"?value:value?.name;\n    const sleeperId=typeof value==="object"?(value?.sleeperId||value?.id):null;\n    if(sleeperId){\n      for(const [key,entry] of Object.entries(market)){\n        if(entry&&typeof entry==="object"&&entry.id&&String(entry.id)===String(sleeperId))return {name:key,entry};\n      }\n    }\n    if(name&&market[name])return {name,entry:market[name]};\n    const n=norm(name);\n    for(const [key,entry] of Object.entries(market)){\n      if(!entry||typeof entry!=="object")continue;\n      if(n&&norm(key)===n)return {name:key,entry};\n    }\n    return null;\n  }'''
          )

          # My Edge must be true Sleeper ADP vs the user's rank. Search rank is a directory/search aid, not ADP.
          replace_exact(
              'live-draft-edge-v82.js',
              '''  function rankInfo(p){\n    let m=null;\n    try{m=typeof marketFor==='function'?marketFor(p):null}catch(_){}\n    let sleeper=Number(m?.rank),source='Sleeper ADP';\n    if(!(Number.isFinite(sleeper)&&sleeper>0)){\n      sleeper=Number(m?.searchRank);\n      source='Sleeper live player rank';\n    }\n    const mine=Number(p?.overall);\n    if(!(Number.isFinite(mine)&&mine>0&&Number.isFinite(sleeper)&&sleeper>0))return {mine:Number.isFinite(mine)?mine:null,sleeper:null,edge:null,source:null};\n    return {mine,sleeper,edge:sleeper-mine,source};\n  }''',
              '''  function rankInfo(p){\n    let m=null;\n    try{m=typeof marketFor==='function'?marketFor(p):null}catch(_){}\n    const sleeper=Number(m?.rank),source='Sleeper ADP';\n    const mine=Number(p?.overall);\n    if(!(Number.isFinite(mine)&&mine>0&&Number.isFinite(sleeper)&&sleeper>0))return {mine:Number.isFinite(mine)?mine:null,sleeper:null,edge:null,source:null};\n    return {mine,sleeper,edge:sleeper-mine,source};\n  }'''
          )

          # Stop eight decorative favicon requests from competing with the app bundle during first paint.
          replace_exact('index.html', "const parts=Array.from({length:8},(_,i)=>'./assets/workhorse-icon-'+i+'.txt?v=1');", "const parts=Array.from({length:0},(_,i)=>'./assets/workhorse-icon-'+i+'.txt?v=1');")

          # Load the 10 tiny bundle chunks with bounded concurrency instead of 10 serial round trips.
          replace_exact(
              'index.html',
              '''  const buffers=[];\n  for(const file of files)buffers.push(await fetchPart(file));''',
              '''  const buffers=new Array(files.length);\n  let nextPart=0;\n  const loadWorker=async()=>{\n    while(true){\n      const i=nextPart++;\n      if(i>=files.length)return;\n      buffers[i]=await fetchPart(files[i]);\n    }\n  };\n  await Promise.all(Array.from({length:Math.min(3,files.length)},loadWorker));'''
          )

          # Cache-bust each changed helper.
          for old, new in [
              ('./patch-v29.js?v=293', './patch-v29.js?v=294'),
              ('./central-adp-v36.js?v=365', './central-adp-v36.js?v=366'),
              ('./live-draft-edge-v82.js?v=82', './live-draft-edge-v82.js?v=821'),
              ('./new-user-adp-v60.js?v=606', './new-user-adp-v60.js?v=607'),
              ('./decision-loader-v61.js?v=636', './decision-loader-v61.js?v=637'),
          ]:
              replace_exact('index.html', old, new)

          # Don't launch all optional feature files simultaneously; defer and load four at a time.
          replace_exact(
              'decision-loader-v61.js',
              "  Promise.all(files.map(loadOne)).catch(e=>console.warn('Workhorse optional feature batch error',e));",
              "  const start=async()=>{for(let i=0;i<files.length;i+=4)await Promise.all(files.slice(i,i+4).map(loadOne))};\n  if('requestIdleCallback' in window)requestIdleCallback(()=>start().catch(e=>console.warn('Workhorse optional feature batch error',e)),{timeout:600});\n  else setTimeout(()=>start().catch(e=>console.warn('Workhorse optional feature batch error',e)),200);"
          )

          # Safety assertions: searchable directory stays 500, automatic/starter lists are now 250.
          central = Path('central-adp-v36.js').read_text()
          starter = Path('new-user-adp-v60.js').read_text()
          edge = Path('live-draft-edge-v82.js').read_text()
          index = Path('index.html').read_text()
          assert 'const DIRECTORY_LIMIT=500;' in central
          assert 'const AUTO_RANK_LIMIT=250;' in central
          assert 'const STARTER_LIMIT=250;' in starter
          assert 'sleeper=Number(m?.searchRank)' not in edge
          assert 'Math.min(3,files.length)' in index
          PY

      - name: Syntax and diff checks
        shell: bash
        run: |
          node --check patch-v29.js
          node --check central-adp-v36.js
          node --check new-user-adp-v60.js
          node --check live-draft-edge-v82.js
          node --check decision-loader-v61.js
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html patch-v29.js central-adp-v36.js new-user-adp-v60.js live-draft-edge-v82.js decision-loader-v61.js
          git commit -m 'Fix startup speed and Edge accuracy'
          git push
