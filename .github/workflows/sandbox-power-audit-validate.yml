name: Validate Team Power Audit

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check audit JavaScript
        run: |
          node --check season-league-power-model-v2.js
          node --check season-league-power-audit-v1.js
      - name: Verify audit is read only and loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          audit=Path('season-league-power-audit-v1.js').read_text()
          model=Path('season-league-power-model-v2.js').read_text()
          page=Path('sandbox-league.html').read_text()
          checks={
            'audit loads': 'season-league-power-audit-v1.js?v=2' in page,
            'model loads before audit': page.index('season-league-power-model-v2.js?v=2') < page.index('season-league-power-audit-v1.js?v=2'),
            'audit uses canonical model': 'WorkhorsePowerModelV2' in audit and 'M.buildTeams(ctx())' in audit,
            'canonical model uses full roster': '(r.players||[])' in model,
            'canonical model ignores current starters': 'r.starters' not in model,
            'audit shows asset value': 'ASSET' in audit and '${fmt(p.raw)}' in audit,
            'audit shows starting slot value': 'SLOT' in audit and '${fmt(p.lineupValue)}' in audit,
            'audit shows role and final power': 'ROLE' in audit and 'POWER' in audit,
            'no database writes': '/rest/v1/' in audit and 'method:' not in audit,
            'no mutation observer loop': 'MutationObserver' not in audit,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if failed: raise SystemExit(', '.join(failed))
          PY
