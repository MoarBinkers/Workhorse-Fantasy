name: Build single Workhorse bundle once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combine-bundle-v91-once.yml'
      - '.github/combine-bundle-v91.py'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and patch combined bundle
        run: python .github/combine-bundle-v91.py
      - name: Verify combined bytes and app integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          b=Path('app-v28.bin').read_bytes()
          assert len(b)==28016, len(b)
          text=gzip.decompress(b)
          assert hashlib.sha256(text).hexdigest()=='77a31b87341147e99b00dbe40a23961addc39723cb8464129cc3c68a13db0879'
          print('Combined bundle verified.')
          PY
      - name: Run permanent performance and accuracy guard
        run: python .github/performance-regression-check.py
      - name: Commit production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v28.bin index.html .github/performance-regression-check.py
          git commit -m "Load Workhorse core in one request"
          git push
