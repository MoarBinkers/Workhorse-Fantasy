name: Validate Interaction Performance

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check interaction performance protections
        run: python .github/performance-regression-check.py
      - name: Check critical release contract
        run: python .github/release-contract-check.py
      - name: Check Live Draft contract
        run: python .github/live-draft-release-check.py
      - name: Check active JavaScript syntax
        run: |
          node --check patch-v29.js
          node --check rank-sync-v38.js
          node --check mobile-touch-v75.js
          node --check tier-v33.js
          node --check central-adp-v92.js
          node --check rank-list-cap-v93.js
          node --check sleeper-rank-cap-v94.js
          node --check ranking-data-recovery-v95.js
          node --check round-bands-v61.js
          node --check drag-scroll-guard-v97.js
          node --check draft-trade-capital-v98.js
          node --check draft-pick-ownership-sync-v102.js
          node --check draft-ownership-v45.js
          node --check live-draft-command-v99.js
          node --check draft-recap-upgrade-v100.js
          node --check decision-loader-v61.js
          node --check cloud-reliability-v41.js
          node --check new-user-adp-v60.js
          node --check player-detail-v34.js
          node --check on-demand-player-search-v88.js
      - name: Check connected ranking behavior
        run: node .github/rank-sync-regression-test.js
