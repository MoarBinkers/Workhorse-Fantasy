name: Validate Interaction Performance

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check interaction performance protections
        run: python .github/performance-regression-check.py
      - name: Check active JavaScript syntax
        run: |
          node --check patch-v29.js
          node --check tier-v33.js
          node --check central-adp-v92.js
          node --check rank-list-cap-v93.js
          node --check sleeper-rank-cap-v94.js
          node --check decision-loader-v61.js
          node --check player-detail-v34.js
          node --check on-demand-player-search-v88.js
