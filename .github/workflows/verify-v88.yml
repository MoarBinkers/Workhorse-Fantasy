name: Verify Workhorse v88 loading

on:
  push:
    paths:
      - '.github/workflows/verify-v88.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify top-250 and on-demand search
        run: |
          node --check central-adp-v36.js
          node --check on-demand-player-search-v88.js
          node --check player-detail-v34.js
          python .github/performance-regression-check.py
