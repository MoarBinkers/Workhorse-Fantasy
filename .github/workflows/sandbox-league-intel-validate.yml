name: Validate League Intelligence

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-league-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check season-league-intelligence-v1.js
          node --check season-league-power-model-v2.js
          node --check season-league-power-bars-v2.js
          node --check season-league-power-audit-v1.js
          node --check season-league-card-details-v1.js
          node --check season-trade-league-mode-v1.js
          node --check season-trade-ui-polish-v1.js
          node --check .github/power-model-sanity-test.js

      - name: Check power-model sanity
        run: node .github/power-model-sanity-test.js

      - name: Verify league power contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          model=Path('season-league-power-model-v2.js').read_text()
          bars=Path('season-league-power-bars-v2.js').read_text()
          audit=Path('season-league-power-audit-v1.js').read_text()
          page=Path('sandbox-league.html').read_text()
          static=Path('.github/workflows/static.yml').read_text()
          checks={
            'production remains main only': 'branches: ["main"]' in static,
            'canonical model loads before bars': page.index('season-league-power-model-v2.js?v=2') < page.index('season-league-power-bars-v2.js?v=2'),
            'ros rank is primary roster curve': '60+45*Math.exp(-.006' in model,
            'historical scarcity is modest': 'Math.max(-3,Math.min(7,delta*.7))' in model,
            'best legal lineup exists': 'function bestLegalLineup' in model and "['RB','WR','TE']" in model,
            'lineup balance matters': 'function lineupBalance(starters)' in model and 'starterSum*.75' in model and 'lowerHalfAvg*values.length' in model,
            'current sleeper starters ignored': 'r.starters' not in model and '(r.players||[])' in model,
            '1qb backups near zero': "p.posRank<=n?.03:.01" in model and "index===1?.003:.001" in model,
            'te can win flex': "chooseFlexible(all,selected,['RB','WR','TE'],f.flex,'FLEX')" in model,
            'rb wr depth diminishes': "[.30,.18,.10,.06,.04,.03]" in model,
            'old explosive curve gone': '210*Math.exp(-.022' not in model and '100*Math.exp(-.085' not in model,
            'position bonus double count gone': 'const cap={QB:' not in model,
            'bars clamped': 'max-width:96%!important' in bars and 'Math.min(96,pct)' in bars,
            'no runaway bar observer': 'observe(teams,{childList:true,subtree:true})' not in bars,
            'audit uses canonical model': 'M.buildTeams(ctx())' in audit,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit(', '.join(failed))
          PY