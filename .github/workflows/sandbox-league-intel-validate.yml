name: Validate League Intelligence

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-league-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check season-league-intelligence-v1.js
          node --check season-league-power-bars-v1.js
          node --check season-league-card-details-v1.js
          node --check season-trade-league-mode-v1.js
          node --check season-trade-ui-polish-v1.js

      - name: Verify league intelligence contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          league=Path('season-league-intelligence-v1.js').read_text()
          bars=Path('season-league-power-bars-v1.js').read_text()
          details=Path('season-league-card-details-v1.js').read_text()
          trade=Path('season-trade-league-mode-v1.js').read_text()
          polish=Path('season-trade-ui-polish-v1.js').read_text()
          page=Path('sandbox-league.html').read_text()
          static=Path('.github/workflows/static.yml').read_text()
          checks={
            'production remains main only': 'branches: ["main"]' in static,
            'league intelligence loads': 'season-league-intelligence-v1.js?v=1' in page,
            'absolute power bars load': 'season-league-power-bars-v1.js?v=1' in page,
            'league card details load': 'season-league-card-details-v1.js?v=1' in page,
            'leader is not normalized to max': 'league leader' not in bars and 'Math.max(1,...' not in bars,
            'shared overall scale exists': 'function buildScale()' in bars and 'state.scale.overall' in bars and 't.overall/state.scale.overall' in bars,
            'team specific bar ceiling removed': 't.m.starters*118+t.m.bench*62+40' not in bars,
            'elite ros curve is strongly nonlinear': '210*Math.exp(-.022*x)' in bars and '100*Math.exp(-.085*x)' in bars and '120*Math.exp(-.0165' not in bars,
            'expanded absolute bar range exists': 'Math.max(30,Math.min(96' in bars and 'Math.pow(ratio,.84)' in bars,
            'bar percentage label remains hidden': '.bar-meta span:last-child{display:none!important}' in bars and "meta[1].textContent=''" in bars,
            'overall power number is restored': '.team .power-num{display:block!important}' in details and 'totalFromSegments' in details and "<small>POWER</small>" in details,
            'rank buckets do not style bars': "card.classList.remove('top','mid','bottom')" in bars and '.team .power-fill.wh-stacked-power' in bars,
            'bar gets more horizontal room': 'minmax(430px,3fr)' in bars,
            'power bars own displayed order': 'parent.appendChild(card)' in bars and 't.ranks.overall=i+1' in bars,
            'overall bar has position segments': 'overallSegments' in bars and 'wh-power-seg' in bars and "POS=['QB','RB','WR','TE']" in bars,
            'position colors are distinct': "QB:'#a98bff'" in bars and "RB:'#59d694'" in bars and "WR:'#5da8ff'" in bars and "TE:'#f0a45d'" in bars,
            'expanded roster shows actual position rank': 'wh-pos-rank-badge' in details and "${pos} #${rank}" in details,
            'expanded roster shows league-size role band': 'function leagueSize()' in details and 'function tier(posRank)' in details and "${pos}${tier(rank)}" in details,
            'expanded roster quality bands are color coded': 'wh-role-badge.t1' in details and 'wh-role-badge.t2' in details and 'wh-role-badge.t3' in details and 'wh-role-badge.t4' in details and 'wh-role-badge.t5' in details,
            'position views use shared absolute ceilings': 'state.scale.pos[p]' in bars and 'function positionPct' in bars and 'starterSlots(pos)' in bars,
            'multiple saved leagues exist': 'wh_sleeper_leagues_v2' in league and 'SAVED LEAGUES' in league and 'wh-saved-league' in league,
            'username can discover several leagues': '/leagues/nfl/${SEASON}' in league and 'for(const l of leagues)upsertLeague' in league,
            'needs do not use league-rank cutoffs': 'needCut=' not in league and 'surplusCut=' not in league and 'needCut=' not in trade and 'surplusCut=' not in trade,
            'fantasy role bands are league-size aware': 'function leagueSize()' in league and 'function fantasyTier(posRank)' in league and '/leagueSize()' in league,
            'needs use actual starter requirements': 'function starterSlots(pos)' in league and 'roster_positions' in league and 'starterTarget' in league,
            'rb1 rb2 rb3 quality weights exist': 'function roleWeight(tier)' in league and 'tier===2' in league and 'tier===3' in league,
            'quality need and supply scores exist': 'needScore' in league and 'supplyScore' in league and 'positionProfile' in league,
            'trade mode mirrors quality needs': 'positionProfileFromRoster' in trade and 'needScore' in trade and 'supplyScore' in trade and 'posRankMap' in trade,
            'position power views exist': "['OVERALL',...POS]" in league and 'data-power-view' in league and 'state.view' in league,
            'position view reorders league teams': "view==='OVERALL'?a.ranks.overall-b.ranks.overall:a.ranks[view]-b.ranks[view]" in league,
            'best trade partners use need x supply': 'partnerFit' in league and 'myNeed*theirSupply+theirNeed*mySupply' in league and 'teamA=' in league and 'teamB=' in league,
            'league snapshots save need profiles': 'wh_league_intel_v1::' in league and 'profiles:Object.fromEntries' in league,
            'trade league mode is loaded': 'season-trade-league-mode-v1.js?v=1' in polish,
            'trade league mode supports saved leagues': 'wh_sleeper_leagues_v2' in trade and 'wh-lm-league' in trade,
            'trade league mode uses real Sleeper rosters': '/league/${id}/rosters' in trade and 'r?.players||[]' in trade and 'rosterPlayers' in trade,
            'league mode restricts add flow to roster picker': 'wh-roster-modal' in trade and 'data-league-pick' in trade and 'openPicker(add.dataset.add)' in trade,
            'generic trade mode remains available': "setActive(!state.active)" in trade and "btn.textContent=state.active?'ON':'OFF'" in trade,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if failed: raise SystemExit('League intelligence checks failed: '+', '.join(failed))
          PY
