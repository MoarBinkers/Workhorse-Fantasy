name: Apply Workhorse interaction performance fix

on:
  push:
    paths:
      - '.github/workflows/performance-v87.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply interaction patch
        run: python performance-patch-v87.py

      - name: Validate changed JavaScript
        run: |
          node --check central-adp-v36.js
          node --check player-detail-v34.js
          git diff --check

      - name: Commit performance fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central-adp-v36.js player-detail-v34.js index.html
          git commit -m 'Make player clicks and rankings renders responsive'
          git push
