name: Validate Workhorse

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-workhorse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find current Workhorse scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          ref_re = re.compile(r'\.\/([A-Za-z0-9._-]+\.js)(?:\?[^\s\"\'\\<>]*)?')
          found = set()
          queue = []

          def add_refs(text):
              for path in ref_re.findall(text):
                  if path not in found:
                      found.add(path)
                      queue.append(path)

          index = root / 'index.html'
          if not index.is_file():
              raise SystemExit('MISSING: index.html')
          add_refs(index.read_text(encoding='utf-8'))

          checked = set()
          while queue:
              path = queue.pop(0)
              if path in checked:
                  continue
              checked.add(path)
              file = root / path
              if not file.is_file():
                  raise SystemExit(f'MISSING loaded script: {path}')
              add_refs(file.read_text(encoding='utf-8'))

          if not checked:
              raise SystemExit('No Workhorse JavaScript files were discovered from index.html')

          Path('/tmp/workhorse-loaded-js.txt').write_text(
              ''.join(f'{p}\n' for p in sorted(checked)), encoding='utf-8'
          )
          print(f'Found {len(checked)} loaded JavaScript files.')
          PY

      - name: Check loaded JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < /tmp/workhorse-loaded-js.txt

      - name: Check production auth protections
        run: |
          python - <<'PY'
          from pathlib import Path

          retired = 'https://moarbinkers.github.io/Draft-Edge/'
          current = 'https://moarbinkers.github.io/Workhorse-Fantasy/'
          auth_files = [
              Path('auth-recovery-v54.js'),
              Path('auth-forgot-popup-v56.js'),
              Path('auth-password-save-v57.js'),
          ]

          for file in auth_files:
              text = file.read_text(encoding='utf-8')
              if retired in text:
                  raise SystemExit(f'STALE production auth redirect found in {file}')
              if current not in text:
                  raise SystemExit(f'Current Workhorse fallback URL missing from {file}')

          index = Path('index.html').read_text(encoding='utf-8')
          index_required = [
              "const credential=h.get('access_token')||h.get('refresh_token')||q.get('code')||q.get('token_hash')||'';",
              "return type==='recovery'&&!!credential;",
              '__WORKHORSE_RECOVERY_FETCH_GUARD__',
              'Account data is locked during password recovery.',
              './auth-recovery-v54.js?v=545',
              './auth-forgot-popup-v56.js?v=564',
              './auth-password-save-v57.js?v=572',
          ]
          for term in index_required:
              if term not in index:
                  raise SystemExit(f'Boot/auth protection missing: {term}')

          recovery = auth_files[0].read_text(encoding='utf-8')
          for term in [
              'hasFreshRecoveryCredential',
              "s.type==='recovery'&&!!s.credential",
              "signOut({scope:'local'})",
              'Sign in with your new password.',
          ]:
              if term not in recovery:
                  raise SystemExit(f'Recovery protection missing: {term}')

          forgot = auth_files[1].read_text(encoding='utf-8')
          for term in [
              'workhorse-password-reset-cooldown-until',
              'setCooldown(60)',
              'repeated taps cannot make the problem worse',
              'Use only the newest Workhorse reset email.',
          ]:
              if term not in forgot:
                  raise SystemExit(f'Reset rate-limit protection missing: {term}')

          if 'Draft Edge account' in forgot or 'Draft Edge recovery email' in forgot:
              raise SystemExit('Forgot-password UI still contains retired Draft Edge branding')

          print('Production auth protection checks passed.')
          PY

      - name: Boot Workhorse in headless Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/workhorse-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No headless Chrome binary is available on this runner.'
            exit 1
          fi

          timeout 60s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --no-first-run \
            --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:4173/ \
            >/tmp/workhorse-dom.html 2>/tmp/workhorse-chrome.log || {
              cat /tmp/workhorse-chrome.log || true
              exit 1
            }

          if grep -q 'The app could not start' /tmp/workhorse-dom.html; then
            echo 'Workhorse reached its startup error screen.'
            exit 1
          fi
          if grep -q 'id="workhorse-app-gate"' /tmp/workhorse-dom.html; then
            echo 'Workhorse never cleared its loading gate.'
            exit 1
          fi
          if ! grep -qi 'WORKHORSE' /tmp/workhorse-dom.html; then
            echo 'Workhorse branding/app content was not rendered.'
            exit 1
          fi

          echo 'Workhorse boot smoke test passed.'

      - name: Note unused legacy scripts
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          loaded = set(Path('/tmp/workhorse-loaded-js.txt').read_text(encoding='utf-8').splitlines())
          all_js = {p.name for p in Path('.').glob('*.js')}
          print(f'{len(all_js - loaded)} root JavaScript files are not part of the current load chain.')
          PY
