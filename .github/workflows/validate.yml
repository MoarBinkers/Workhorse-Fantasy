name: Validate Workhorse

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-workhorse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find current Workhorse scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          ref_re = re.compile(r'\.\/([A-Za-z0-9._-]+\.js)(?:\?[^\s\"\'\\<>]*)?')
          found = set()
          queue = []

          def add_refs(text):
              for path in ref_re.findall(text):
                  if path not in found:
                      found.add(path)
                      queue.append(path)

          index = root / 'index.html'
          if not index.is_file():
              raise SystemExit('MISSING: index.html')
          add_refs(index.read_text(encoding='utf-8'))

          checked = set()
          while queue:
              path = queue.pop(0)
              if path in checked:
                  continue
              checked.add(path)
              file = root / path
              if not file.is_file():
                  raise SystemExit(f'MISSING loaded script: {path}')
              add_refs(file.read_text(encoding='utf-8'))

          if not checked:
              raise SystemExit('No Workhorse JavaScript files were discovered from index.html')

          Path('/tmp/workhorse-loaded-js.txt').write_text(
              ''.join(f'{p}\n' for p in sorted(checked)), encoding='utf-8'
          )
          print(f'Found {len(checked)} loaded JavaScript files.')
          PY

      - name: Check loaded JavaScript syntax
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < /tmp/workhorse-loaded-js.txt

      - name: Check production auth protections
        run: |
          python - <<'PY'
          from pathlib import Path

          retired = 'https://moarbinkers.github.io/Draft-Edge/'
          current = 'https://moarbinkers.github.io/Workhorse-Fantasy/'
          auth_files = [
              Path('auth-recovery-v54.js'),
              Path('auth-forgot-popup-v56.js'),
              Path('auth-password-save-v57.js'),
          ]

          for file in auth_files:
              text = file.read_text(encoding='utf-8')
              if retired in text:
                  raise SystemExit(f'STALE production auth redirect found in {file}')
              if current not in text:
                  raise SystemExit(f'Current Workhorse fallback URL missing from {file}')

          recovery = auth_files[0].read_text(encoding='utf-8')
          required = [
              'hasFreshRecoveryCredential',
              "s.type==='recovery'&&!!s.credential",
              '__WORKHORSE_RECOVERY_PENDING__',
              'workhorse-recovery-lock',
              "signOut({scope:'local'})",
              'Sign in with your new password.',
              'A bare/stale #type=recovery marker is not proof of a live reset session.',
          ]
          for term in required:
              if term not in recovery:
                  raise SystemExit(f'Password recovery protection missing: {term}')

          index = Path('index.html').read_text(encoding='utf-8')
          for term in [
              '__WORKHORSE_RECOVERY_FETCH_GUARD__',
              'Account data is locked during password recovery.',
              'workhorse-recovery-lock',
          ]:
              if term not in index:
                  raise SystemExit(f'Boot-time recovery protection missing: {term}')

          print('Production auth protection checks passed.')
          PY

      - name: Boot Workhorse normally
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/workhorse-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4173/ \
            >/tmp/workhorse-dom.html 2>/tmp/workhorse-chrome.log || {
              cat /tmp/workhorse-chrome.log || true
              exit 1
            }
          if grep -q 'The app could not start' /tmp/workhorse-dom.html; then
            echo 'Workhorse reached its startup error screen.'; exit 1
          fi
          if grep -q 'id="workhorse-app-gate"' /tmp/workhorse-dom.html; then
            echo 'Workhorse never cleared its loading gate.'; exit 1
          fi
          if ! grep -qi 'WORKHORSE' /tmp/workhorse-dom.html; then
            echo 'Workhorse branding/app content was not rendered.'; exit 1
          fi
          echo 'Normal Workhorse boot passed.'

      - name: Test stale recovery URL returns to sign in
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/workhorse-stale-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 35s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:4174/#type=recovery' \
            >/tmp/workhorse-stale-dom.html 2>/tmp/workhorse-stale-chrome.log || {
              cat /tmp/workhorse-stale-chrome.log || true
              exit 1
            }
          if grep -q 'The app could not start' /tmp/workhorse-stale-dom.html; then
            echo 'Stale recovery URL caused startup failure.'; exit 1
          fi
          if grep -q 'Set New Password' /tmp/workhorse-stale-dom.html; then
            echo 'Bare stale recovery marker incorrectly trapped the user in reset mode.'; exit 1
          fi
          if ! grep -q 'Sign In' /tmp/workhorse-stale-dom.html; then
            echo 'Normal sign-in screen was not restored after stale recovery URL.'
            exit 1
          fi
          echo 'Stale recovery URL correctly returned to normal sign in.'

      - name: Note unused legacy scripts
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          loaded = set(Path('/tmp/workhorse-loaded-js.txt').read_text(encoding='utf-8').splitlines())
          all_js = {p.name for p in Path('.').glob('*.js')}
          unused = sorted(all_js - loaded)
          print(f'{len(unused)} root JavaScript files are not part of the current load chain.')
          PY