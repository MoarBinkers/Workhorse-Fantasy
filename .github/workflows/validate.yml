name: Validate Workhorse

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: validate-workhorse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find current Workhorse scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          ref_re = re.compile(r'\.\/([A-Za-z0-9._-]+\.js)(?:\?[^\s\"\'\\<>]*)?')
          found = set()
          queue = []

          def add_refs(text):
              for path in ref_re.findall(text):
                  if path not in found:
                      found.add(path)
                      queue.append(path)

          index = root / 'index.html'
          if not index.is_file():
              raise SystemExit('MISSING: index.html')
          add_refs(index.read_text(encoding='utf-8'))

          checked = set()
          while queue:
              path = queue.pop(0)
              if path in checked:
                  continue
              checked.add(path)
              file = root / path
              if not file.is_file():
                  raise SystemExit(f'MISSING loaded script: {path}')
              add_refs(file.read_text(encoding='utf-8'))

          if not checked:
              raise SystemExit('No Workhorse JavaScript files were discovered from index.html')

          Path('/tmp/workhorse-loaded-js.txt').write_text(
              ''.join(f'{p}\n' for p in sorted(checked)), encoding='utf-8'
          )
          print(f'Found {len(checked)} loaded JavaScript files.')
          PY

      - name: Check loaded JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < /tmp/workhorse-loaded-js.txt

      - name: Check production protections
        run: |
          python - <<'PY'
          from pathlib import Path

          retired = 'https://moarbinkers.github.io/Draft-Edge/'
          current = 'https://moarbinkers.github.io/Workhorse-Fantasy/'
          auth_files = [
              Path('auth-recovery-v54.js'),
              Path('auth-forgot-popup-v56.js'),
              Path('auth-password-save-v57.js'),
          ]

          for file in auth_files:
              text = file.read_text(encoding='utf-8')
              if retired in text:
                  raise SystemExit(f'STALE production auth redirect found in {file}')
              if current not in text:
                  raise SystemExit(f'Current Workhorse fallback URL missing from {file}')

          index = Path('index.html').read_text(encoding='utf-8')
          index_required = [
              "const marker=q.get('workhorse_recovery')==='1';",
              "const credential=h.get('access_token')||h.get('refresh_token')||q.get('code')||q.get('token_hash')||'';",
              "return (type==='recovery'||marker)&&!!credential;",
              '__WORKHORSE_RECOVERY_BOOT_PROOF__=true',
              '__WORKHORSE_RECOVERY_FETCH_GUARD__',
              'Account data is locked during password recovery.',
              'body>*:not(#authGate):not(#deRecovery54)',
              './auth-recovery-v54.js?v=548',
              './auth-forgot-popup-v56.js?v=565',
              './auth-password-save-v57.js?v=573',
              './new-user-adp-v60.js?v=607',
              './draft-room-v41.js?v=412',
              './decision-loader-v61.js?v=637',
          ]
          for term in index_required:
              if term not in index:
                  raise SystemExit(f'Boot/production protection missing: {term}')

          recovery = auth_files[0].read_text(encoding='utf-8')
          recovery_required = [
              'hasFreshRecoveryCredential',
              'if(window.__WORKHORSE_RECOVERY_BOOT_PROOF__)return true;',
              "return (s.type==='recovery'||s.marker)&&!!s.credential;",
              "q.get('workhorse_recovery')==='1'",
              "'workhorse_recovery'",
              'RECOVERY_URL',
              "signOut({scope:'local'})",
              'Sign in with your new password.',
              'document.body.appendChild(box)',
              'html.workhorse-recovery-lock body>*:not(#deRecovery54)',
              'html.workhorse-recovery-lock #authGate{visibility:hidden!important;pointer-events:none!important}',
              'function bindTouchField(field)',
              "field.addEventListener('pointerdown',focus",
              "field.addEventListener('touchend',focus",
              'function bindTouchButton(button,action)',
              "button.addEventListener('touchend'",
              'pointer-events:auto!important',
              'touch-action:manipulation!important',
              'id="deRecoverySave54" type="button"',
          ]
          for term in recovery_required:
              if term not in recovery:
                  raise SystemExit(f'Recovery/touch protection missing: {term}')

          forgot = auth_files[1].read_text(encoding='utf-8')
          for term in [
              'workhorse-password-reset-cooldown-until',
              'setCooldown(60)',
              'repeated taps cannot make the problem worse',
              'Use only the newest Workhorse reset email.',
              "u.searchParams.set('workhorse_recovery','1')",
              'redirectTo:RECOVERY_URL',
              './auth-password-save-v57.js?v=573',
          ]:
              if term not in forgot:
                  raise SystemExit(f'Reset email protection missing: {term}')

          redirect_guard = auth_files[2].read_text(encoding='utf-8')
          for term in [
              'function recoverySiteUrl()',
              "u.searchParams.set('workhorse_recovery','1')",
              'redirectTo:recoveryRedirectTo',
              'emailRedirectTo:redirectTo',
          ]:
              if term not in redirect_guard:
                  raise SystemExit(f'Auth redirect guard missing: {term}')

          if 'Draft Edge account' in forgot or 'Draft Edge recovery email' in forgot:
              raise SystemExit('Forgot-password UI still contains retired Draft Edge branding')

          starter = Path('new-user-adp-v60.js').read_text(encoding='utf-8')
          for term in [
              "WorkhorseDefaultRankingsPolicy='sleeper-adp-until-customized'",
              "const STARTER_FORMAT='ppr'",
              'const STARTER_LIMIT=250;',
              'async function createLocalStarter()',
              'async function migrateUntouchedCloudStarter()',
              "const list=cleanListData('My Rankings',playersFromRows(rows));",
              'if(ids.length===0)await createLocalStarter();',
              'else if(currentUser)await migrateUntouchedCloudStarter();',
              'try{queueCloudSave()}catch(_){try{save()}catch(__){}}',
              "window.addEventListener('workhorse:cloud-rankings-ready'",
          ]:
              if term not in starter:
                  raise SystemExit(f'Default Sleeper ADP onboarding protection missing: {term}')

          # Rankings/Edge invariants: keep the fast default board at 250 without shrinking manual player access.
          central = Path('central-adp-v36.js').read_text(encoding='utf-8')
          for term in [
              'const AUTO_RANK_LIMIT=250;',
              'const DIRECTORY_LIMIT=500;',
              'try{sleeperPool=pool}',
          ]:
              if term not in central:
                  raise SystemExit(f'Player-load/search invariant missing: {term}')

          edge = Path('live-draft-edge-v82.js').read_text(encoding='utf-8')
          if 'edge:sleeper-mine' not in edge:
              raise SystemExit('My Edge sign/formula changed unexpectedly')
          if 'm?.searchRank' in edge or 'Sleeper live player rank' in edge:
              raise SystemExit('My Edge must use true Sleeper ADP only, never search rank')

          market_patch = Path('patch-v29.js').read_text(encoding='utf-8')
          if 'data-market-add' not in market_patch:
              raise SystemExit('Manual Add Player path is missing')
          id_pos = market_patch.find('if(sleeperId){')
          name_pos = market_patch.find('if(name&&market[name])')
          if id_pos < 0 or name_pos < 0 or id_pos > name_pos:
              raise SystemExit('Sleeper ID matching must remain ahead of name matching')

          cloud = Path('cloud-reliability-v41.js').read_text(encoding='utf-8')
          for term in [
              ".eq('user_id',currentUser.id)",
              ".eq('revision',expectedRevision)",
              'storeRecoveryVersion',
              'resolveConflict',
          ]:
              if term not in cloud:
                  raise SystemExit(f'Cloud ranking safety behavior missing: {term}')

          draft = Path('draft-room-v41.js').read_text(encoding='utf-8')
          for term in [
              "STATUS_CACHE_KEY='workhorse-draft-player-status-v412'",
              "window.addEventListener('load',scheduleStatusLoad,{once:true})",
              'setTimeout(kickStatusLoad,2500)',
              ".order('search_rank',{ascending:true})",
              '.limit(STATUS_LIMIT)',
          ]:
              if term not in draft:
                  raise SystemExit(f'Draft status performance guard missing: {term}')
          if 'STATUS_BATCH' in draft:
              raise SystemExit('Draft room reintroduced chunked startup status batches')
          if draft.count("client.from('sleeper_player_status')") != 1:
              raise SystemExit('Draft room must have exactly one Sleeper status query path')

          loader = Path('decision-loader-v61.js').read_text(encoding='utf-8')
          if './adp-unranked-label-v78.js?v=783' not in loader:
              raise SystemExit('Optimized fallback-rank helper cache key is missing')
          fallback = Path('adp-unranked-label-v78.js').read_text(encoding='utf-8')
          for term in [
              'const direct=Number(info?.searchRank)',
              "window.addEventListener('load',scheduleRefresh,{once:true})",
              'setTimeout(refresh,6000)',
          ]:
              if term not in fallback:
                  raise SystemExit(f'Fallback-rank performance guard missing: {term}')
          if "window.addEventListener('workhorse:central-adp-ready'" in fallback:
              raise SystemExit('Fallback rank helper must not race the central ADP directory at startup')

          fixture = Path('.github/test-fixtures/mobile-recovery-interaction.html').read_text(encoding='utf-8')
          for term in ['elementFromPoint', "pointerType:'touch'", "new w.Event('touchend'", 'data-recovery-touch-result']:
              if term not in fixture:
                  raise SystemExit(f'Mobile recovery interaction fixture missing: {term}')

          print('Production auth, recovery redirect, real mobile touch, cloud and startup protections passed.')
          PY

      - name: Audit startup data callers
        run: |
          echo 'Files that reference sleeper_player_status:'
          grep -RIl --include='*.js' 'sleeper_player_status' . | sort || true
          echo 'Files that reference injury_status:'
          grep -RIl --include='*.js' 'injury_status' . | sort || true

      - name: Browser matrix and real mobile recovery touch
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/workhorse-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No headless Chrome binary is available on this runner.'
            exit 1
          fi

          run_case() {
            name="$1"
            url="$2"
            size="$3"
            out="/tmp/workhorse-${name}.html"
            log="/tmp/workhorse-${name}.log"
            start=$(date +%s%3N)
            timeout 45s "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --no-first-run \
              --window-size="$size" \
              --virtual-time-budget=8000 \
              --dump-dom "$url" \
              >"$out" 2>"$log" || {
                cat "$log" || true
                exit 1
              }
            end=$(date +%s%3N)
            echo "$name 8s-budget boot elapsed: $((end-start)) ms"

            if grep -q 'The app could not start' "$out"; then
              echo "$name reached its startup error screen."
              exit 1
            fi
            if grep -q 'id="workhorse-app-gate"' "$out"; then
              echo "$name never cleared its loading gate within the 8-second virtual-time budget."
              exit 1
            fi
            if ! grep -qi 'WORKHORSE' "$out"; then
              echo "$name did not render Workhorse."
              exit 1
            fi
            if ! grep -q 'id="authEmail"' "$out" || ! grep -q 'id="authPassword"' "$out" || ! grep -q 'id="authSubmit"' "$out"; then
              echo "$name is missing normal auth controls."
              exit 1
            fi
          }

          run_case desktop http://127.0.0.1:4173/ 1440,1000
          run_case mobile http://127.0.0.1:4173/ 390,844
          run_case stale-recovery 'http://127.0.0.1:4173/#type=recovery' 390,844
          run_case stale-marked-recovery 'http://127.0.0.1:4173/?workhorse_recovery=1' 390,844

          for stale in /tmp/workhorse-stale-recovery.html /tmp/workhorse-stale-marked-recovery.html; do
            if grep -q 'Set New Password' "$stale"; then
              echo 'Stale recovery marker incorrectly opened password-reset mode.'
              exit 1
            fi
            if grep -Eq '<html[^>]*class="[^"]*workhorse-recovery-lock' "$stale"; then
              echo 'Stale recovery marker left the recovery privacy lock active.'
              exit 1
            fi
            if ! grep -q '>Sign In<' "$stale"; then
              echo 'Stale recovery URL did not restore normal Sign In.'
              exit 1
            fi
          done

          if ! grep -q 'id="workhorseMobilePolish81"' /tmp/workhorse-mobile.html; then
            echo 'Mobile polish did not load in the mobile browser test.'
            exit 1
          fi

          TOUCH_OUT=/tmp/workhorse-recovery-touch.html
          TOUCH_LOG=/tmp/workhorse-recovery-touch.log
          timeout 50s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --no-first-run \
            --window-size=390,844 \
            --virtual-time-budget=14000 \
            --dump-dom http://127.0.0.1:4173/.github/test-fixtures/mobile-recovery-interaction.html \
            >"$TOUCH_OUT" 2>"$TOUCH_LOG" || {
              cat "$TOUCH_LOG" || true
              exit 1
            }

          if ! grep -q 'data-recovery-touch-result="pass"' "$TOUCH_OUT"; then
            echo 'Real mobile recovery touch test failed.'
            grep -o 'data-recovery-touch-message="[^"]*"' "$TOUCH_OUT" || true
            cat "$TOUCH_LOG" || true
            exit 1
          fi

          echo 'Desktop, mobile, stale recovery and real recovery touch interaction tests passed.'

      - name: Note unused legacy scripts
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          loaded = set(Path('/tmp/workhorse-loaded-js.txt').read_text(encoding='utf-8').splitlines())
          all_js = {p.name for p in Path('.').glob('*.js')}
          print(f'{len(all_js - loaded)} root JavaScript files are not part of the current load chain.')
          PY