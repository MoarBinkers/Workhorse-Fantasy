name: Validate Workhorse Sandbox

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4

      - name: Validate production contracts remain intact
        run: |
          python .github/performance-regression-check.py
          python .github/release-contract-check.py
          python .github/live-draft-release-check.py
          node .github/rank-sync-regression-test.js

      - name: Check sandbox JavaScript syntax
        run: |
          node --check sandbox-guard-v1.js
          node --check sandbox-admin-v1.js
          node --check season-home-v1.js
          node --check season-rankings-v3.js
          node --check season-rankings-seed-v1.js
          node --check season-rankings-enhance-v4.js
          node --check sandbox-tools-v1.js
          node --check sandbox-rankings-loader-v2.js
          node --check sandbox-open-tool-v1.js
          node --check sandbox-return-home-v2.js

      - name: Verify sandbox safety and premium in-season product split
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('sandbox.html').read_text()
          guard=Path('sandbox-guard-v1.js').read_text()
          admin=Path('sandbox-admin-v1.js').read_text()
          home=Path('season-home-v1.js').read_text()
          season=Path('season-rankings-v3.js').read_text()
          seed=Path('season-rankings-seed-v1.js').read_text()
          enhance=Path('season-rankings-enhance-v4.js').read_text()
          tools=Path('sandbox-tools-v1.js').read_text()
          legacy=Path('sandbox-rankings-loader-v2.js').read_text()
          checks={
            'sandbox page is noindex':'noindex,nofollow,noarchive' in page,
            'guard loads before sandbox app':'sandbox-guard-v1.js' in page,
            'season home remains default':'IN-SEASON MODE' in page and 'Latest fantasy news' in page,
            'PPR ROS route exists':'view=ros' in page,
            'PPR weekly route exists':'view=weekly' in page,
            'personal rankings route exists':'view=my-rankings' in page,
            'tools opens a hub first':'view=tools' in page and 'sandbox-tools-v1.js' in page,
            'home does not load legacy bundle':'app-v28.bin' not in page,
            'legacy bundle is click-gated':'app-v28.bin' in legacy,
            'tools hub offers specific utilities':'ADP & Draft Board' in tools and 'Live Draft' in tools and 'Preseason Rankings & Tiers' in tools,
            'rankings have Sleeper headshots':'sleepercdn.com/content/nfl/players/thumb/' in season,
            'rankings fetch actual season stats':'/stats/nfl/regular/' in season and 'pts_ppr' in season,
            'rankings support mouse drag':'dragstart' in season and 'dropBefore' in season,
            'rankings support touch drag':'pointerdown' in season and 'drag-handle' in season,
            'master and personal stores are separate':'wh_ros_master_v3' in season and 'wh_my_ros_v3' in season,
            'weekly boards are separated by week':'wh_week_master_v3::' in season and 'wh_my_week_v3::' in season,
            'owner verification protects master editing':'workhorse_role' in season and "==='owner'" in season,
            'live season feed exists':'player_news' in home and 'sleeper_player_status' in home,
            'owner-only site editor remains':'workhorse_role' in admin and "==='owner'" in admin,
            'editor bootstraps before route loading':'sandbox-admin-v1.js?v=7' in guard and 'editorBootstrap' in guard,
            'original editor toolbar restored':all(x in admin for x in ['AUTO-SAVED','VIEW','EDIT','PREVIEW','deUndo','deRedo','deTools','dePublish']),
            'floating text editor restored':'Edit selected text' in admin and 'deEditorInput' in admin and 'data-site-edit' in admin,
            'editor protects live ranking player data':'#rank-rows' in admin and '.rank-card' in admin and '.stats' in admin,
            'fresh boards seed rendered rankings before enhancement':'season-rankings-seed-v1.js?v=1' in page and 'rank-row[data-id]' in seed and 'localStorage.setItem(key' in seed,
            'ranking enhancement loads after seed':'season-rankings-enhance-v4.js?v=2' in page and page.index('season-rankings-seed-v1.js?v=1') < page.index('season-rankings-enhance-v4.js?v=2'),
            'weekly caps are 75 WR and 50 RB':"if(pos==='WR')return 75" in enhance and "if(pos==='RB')return 50" in enhance,
            'ROS caps are 100 WR and 75 RB':"if(pos==='WR')return 100" in enhance and "if(pos==='RB')return 75" in enhance,
            'ROS movement says Change and weekly suppresses it':'Change ▲' in enhance and "if(isWeekly)return''" in enhance,
            'add player exists for editable boards':'+ Add Player' in enhance and 'wh-add-modal' in enhance,
            'weekly start tiers exist':all(x in enhance for x in ['Must Start','Great Start','Comfortable Flex','Shaky Flex']),
            'market wording is replaced in enhanced rows':'Market #' not in enhance and 'not based on ADP' in enhance,
            'production write block exists':'sandbox_write_blocked' in guard,
            'storage is namespaced':'wh_sandbox_v1::' in guard,
            'publish remains locked':'Production is locked' in admin and 'cannot publish to the live Workhorse site' in admin,
            'main deploy workflow still targets main':'branches: ["main"]' in Path('.github/workflows/static.yml').read_text(),
          }
          failed=[n for n,v in checks.items() if not v]
          for n,v in checks.items():print(('PASS' if v else 'FAIL')+': '+n)
          if failed:raise SystemExit('Sandbox checks failed: '+', '.join(failed))
          PY
