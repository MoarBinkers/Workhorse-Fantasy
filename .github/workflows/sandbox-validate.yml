name: Validate Workhorse Sandbox

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4

      - name: Validate production contracts remain intact
        run: |
          python .github/performance-regression-check.py
          python .github/release-contract-check.py
          python .github/live-draft-release-check.py
          node .github/rank-sync-regression-test.js

      - name: Check season JavaScript syntax
        run: |
          for f in sandbox-guard-v1.js sandbox-admin-v1.js season-home-v1.js season-rankings-v3.js season-rankings-seed-v1.js season-rankings-enhance-v4.js season-rankings-ui-v5.js season-rankings-drag-v1.js season-player-detail-v1.js season-matchup-reference-v1.js season-matchup-expanded-v1.js season-injury-status-v1.js season-owner-control-v1.js season-insight-v3.js season-compare-v1.js season-matchup-trends-v1.js season-regression-fix-v2.js season-card-polish-v1.js season-ros-tiers-v4.js season-ros-change-fix-v1.js season-trade-calculator-v5.js sandbox-tools-v1.js sandbox-rankings-loader-v2.js sandbox-open-tool-v1.js sandbox-return-home-v2.js; do node --check "$f"; done

      - name: Verify product and UI stability contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          page=Path('sandbox.html').read_text()
          guard=Path('sandbox-guard-v1.js').read_text()
          admin=Path('sandbox-admin-v1.js').read_text()
          seed=Path('season-rankings-seed-v1.js').read_text()
          drag=Path('season-rankings-drag-v1.js').read_text()
          matchup=Path('season-matchup-reference-v1.js').read_text()
          injury=Path('season-injury-status-v1.js').read_text()
          owner=Path('season-owner-control-v1.js').read_text()
          polish=Path('season-card-polish-v1.js').read_text()
          insight=Path('season-insight-v3.js').read_text()
          compare=Path('season-compare-v1.js').read_text()
          tiers=Path('season-ros-tiers-v4.js').read_text()
          change=Path('season-ros-change-fix-v1.js').read_text()
          tools=Path('sandbox-tools-v1.js').read_text()
          trade=Path('season-trade-calculator-v5.js').read_text()

          repl={'QB':12,'RB':30,'WR':36,'TE':12}
          def rank_value(rank): return 6+114*math.exp(-.0165*max(0,rank-1))
          def expected(pos,r):
              floor={'QB':16,'RB':8.8,'WR':9.5,'TE':7.4}[pos]
              ceil={'QB':24.5,'RB':21,'WR':21.5,'TE':17}[pos]
              decay={'QB':.16,'RB':.085,'WR':.075,'TE':.15}[pos]
              rr=repl[pos]
              if r<=rr: return floor+(ceil-floor)*math.exp(-decay*max(0,r-1))
              return max(3,floor-.28*(r-rr))
          def value(rank,pos,posrank):
              edge=expected(pos,posrank)-expected(pos,repl[pos])
              bonus=max(-4,min(10,edge*.9))
              return round(rank_value(rank)+bonus)
          elite_gap=value(1,'RB',1)-value(2,'RB',2)
          def pkg_weight(final,edge,index,best=100):
              if index==0: return 1
              relative=max(0,min(1,final/best))
              edgeq=max(0,min(1,(edge+1.5)/8.5))
              quality=.58*edgeq+.42*relative
              floors=[1,.52,.32,.20]; caps=[1,.96,.86,.74]
              w=floors[index]+(caps[index]-floors[index])*quality
              if edge<=0: w*=.72
              return max(.14,min(1,w))
          starter_weight=pkg_weight(75,5,1)
          depth_weight=pkg_weight(45,-2,1)

          checks={
            'sandbox safety remains': 'sandbox_write_blocked' in guard and 'wh_sandbox_v1::' in guard and 'Production is locked' in admin,
            'production deploy remains main only': 'branches: ["main"]' in Path('.github/workflows/static.yml').read_text(),
            'season routes remain': all(x in page for x in ['view=ros','view=weekly','view=my-rankings']),
            'smooth drag remains': all(x in drag for x in ['pointerdown','pointermove','pointerup','wh-drag-ghost','wh-drop-line','scrollLoop']),
            'owner mode remains toggleable': all(x in owner for x in ['OWNER MODE · ON','OWNER MODE · OFF','wh-owner-control']),
            'owner rank controls remain': all(x in owner for x in ['wh-owner-precision','data-up','data-down','data-rank']),
            'owner controls are mounted inside rank area': "if(p.parentElement!==area)area.appendChild(p)" in owner,
            'owner control no longer uses timer repaint': 'setInterval' not in owner,
            'owner mode does not create a fifth card column': 'grid-template-columns:70px 44px minmax(0,1fr) 80px 142px' not in polish and 'grid-template-columns:70px 44px minmax(0,1fr) 80px!important' in polish,
            'ROS ALL visually hides tier UI': 'body:has(.filter.active[data-filter="ALL"]) #rank-rows .wh-ros-tier-break' in polish and '#rank-rows .wh-ros-tier-chip' in polish and '#wh-ros-add-tier' in polish,
            'positional tier system remains editable': all(x in tiers for x in ['ADD NEXT TIER','data-add-tier-pos','workhorse:ros-tier-drop','assignment']),
            'tier defaults remain': all(x in tiers for x in ['QB:[6,12,18]','RB:[12,24,48]','WR:[12,24,48]','TE:[6,12,18]']),
            'Change remains idle stable': 'observe(document.documentElement' not in change and 'observe(box,{childList:true,subtree:false})' in change,
            'weekly matchup remains position specific': "POSITIONS=['QB','RB','WR','TE']" in matchup and 'table[team][pos]' in matchup,
            'injury handling remains': all(x in injury for x in ['QUESTIONABLE','DOUBTFUL','OUT / UNAVAILABLE']),
            'insights remain': all(x in insight for x in ['Role trend','Why Ranked','Save rationale','Smart Search','Game total','vs WH']),
            'compare remains': 'selected.size>=3' in compare and 'Player Comparison' in compare,
            'current modules load': all(x in seed for x in ['season-owner-control-v1.js','season-insight-v3.js','season-regression-fix-v2.js','season-card-polish-v1.js','season-ros-tiers-v4.js']),
            'Trade Calculator route exists': "v==='trade'" in page and 'season-trade-calculator-v5.js?v=5' in page,
            'Trade Calculator is featured in Tools': 'Trade Calculator' in tools and 'view=trade' in tools and 'FLAGSHIP' in tools,
            'trade model is PPR ROS based': all(x in trade for x in ['wh_ros_master_v3','PPR · REST OF SEASON']),
            'tiers do not affect trade value': 'wh_ros_tiers' not in trade and 'tierBonus' not in trade and 'tierState' not in trade,
            'trade value editing stays removed': 'EDIT VALUE' not in trade and 'wh_trade_value_overrides' not in trade and 'data-edit' not in trade,
            'value over replacement exists': 'REPL={QB:12,RB:30,WR:36,TE:12}' in trade and 'function expectedPpr(pos,r)' in trade and 'function replacementEdge(pos,r)' in trade,
            'VOR stays internal instead of cluttering cards': 'replacementBonus' in trade and 'vs repl' not in trade and 'model-note' not in trade,
            'adjacent elite RBs stay slight': 2 <= elite_gap <= 7,
            'smart package weighting exists': 'function packageWeight(info,index,best)' in trade and 'edgeQuality' in trade and 'relative' in trade and 'WEIGHTS=' not in trade,
            'starter second piece keeps strong value': starter_weight >= .80,
            'depth second piece is discounted hard': depth_weight <= .55,
            'starter and depth pieces are materially different': starter_weight-depth_weight >= .25,
            'package quality remains internal': all(x in trade for x in ['DIFFERENCE-MAKER','STARTER-GRADE','USABLE STARTER','DEPTH']) and 'packageClass' not in trade.split('function playerCard')[1].split('function renderSide')[0],
            'best asset premium remains package-specific': 'const packageDeal=' in trade and 'packageDeal&&topDiff' in trade,
            'compact fairness line remains above trade': trade.index('<section class="fairness">') < trade.index('<section class="trade">') and 'height:10px' in trade and 'max-width:380px' in trade,
            'fairness marker animates': 'fair-marker' in trade and 'transition:left .5s' in trade and "style.left=`${50-v.lean}%`" in trade,
            'fairness UI has no percentage': '50/50' not in trade and 'fairness meter' not in trade.lower(),
            'player cards do not advertise trade points': 'TRADE VALUE' not in trade and 'class="value"' not in trade and 'class="value-num"' in trade,
            'search results show ROS not trade points': '<em>ROS #${vi?.rank' in trade,
            'trade value details sit below trade': trade.index('<section class="value-details">') > trade.index('<section class="trade">') and 'Trade value details' in trade,
            'unnecessary model explainer is removed': 'Why Workhorse sees it this way' not in trade and 'model-note' not in trade and 'fair-note' in trade,
            'trade supports four players per side': 'up to 4' in trade and 'sides[searchSide].length<4' in trade,
          }
          failed=[n for n,v in checks.items() if not v]
          for n,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+n)
          if failed: raise SystemExit('Sandbox checks failed: '+', '.join(failed))
          PY
