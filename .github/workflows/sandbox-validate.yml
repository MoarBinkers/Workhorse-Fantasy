name: Validate Workhorse Sandbox

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4

      - name: Validate production contracts remain intact
        run: |
          python .github/performance-regression-check.py
          python .github/release-contract-check.py
          python .github/live-draft-release-check.py
          node .github/rank-sync-regression-test.js

      - name: Check sandbox JavaScript syntax
        run: |
          for f in sandbox-guard-v1.js sandbox-admin-v1.js season-home-v1.js season-rankings-v3.js season-rankings-seed-v1.js season-rankings-enhance-v4.js season-rankings-ui-v5.js season-rankings-drag-v1.js season-player-detail-v1.js season-owner-control-v1.js season-insight-v3.js season-card-polish-v1.js season-ros-tiers-v4.js season-ros-change-fix-v1.js season-trade-calculator-v7.js season-trade-ui-polish-v1.js season-league-overview-v1.js season-league-intelligence-v1.js season-league-power-model-v2.js season-league-power-bars-v2.js season-league-card-details-v1.js season-league-power-audit-v1.js sandbox-tools-v1.js .github/power-model-sanity-test.js; do node --check "$f"; done

      - name: Check power-model sanity
        run: node .github/power-model-sanity-test.js

      - name: Verify current Workhorse contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('sandbox.html').read_text()
          guard=Path('sandbox-guard-v1.js').read_text()
          drag=Path('season-rankings-drag-v1.js').read_text()
          owner=Path('season-owner-control-v1.js').read_text()
          trade=Path('season-trade-calculator-v7.js').read_text()
          polish=Path('season-trade-ui-polish-v1.js').read_text()
          league=Path('season-league-overview-v1.js').read_text()
          league_page=Path('sandbox-league.html').read_text()
          model=Path('season-league-power-model-v2.js').read_text()
          bars=Path('season-league-power-bars-v2.js').read_text()
          audit=Path('season-league-power-audit-v1.js').read_text()
          tools=Path('sandbox-tools-v1.js').read_text()
          static=Path('.github/workflows/static.yml').read_text()
          checks={
            'sandbox guard remains': 'sandbox_write_blocked' in guard and 'Production is locked' in Path('sandbox-admin-v1.js').read_text(),
            'production deploy remains main only': 'branches: ["main"]' in static,
            'season rankings restore owner editing': 'ensureOwnerControl' in drag and 'season-owner-control-v1.js?v=1' in drag and 'wh-owner-control' in owner and 'data-wh-owner-editable' in owner,
            'owner edit observer survives rerenders': 'function attachRankObserver()' in owner and 'rankObserver.observe(observedBox' in owner and 'attachRankObserver();const barObs' in owner,
            'trade route loads current calculator': "v==='trade'" in page and 'season-trade-calculator-v7.js?v=7' in page and 'season-trade-ui-polish-v1.js?v=1' in page,
            'trade keeps VOR and smart packages': all(x in trade for x in ['REPL={QB:12,RB:30,WR:36,TE:12}','function replacementEdge(pos,r)','function packageWeight(info,index,best)','packageDeal&&topDiff']),
            'trade tiers stay out': 'wh_ros_tiers' not in trade and 'tierBonus' not in trade,
            'trade value editor stays out': 'EDIT VALUE' not in trade and 'wh_trade_value_overrides' not in trade,
            'fairness colors and animation remain': all(x in trade for x in ['favor-a','favor-b','fairSettle','--win:#6fdfa0','--lose:#ef727c','--close:#e3c561']),
            'ROS rank is promoted': '.ros{font-size:13px!important' in polish and 'ROS #' in trade,
            'league overview page loads': 'season-league-overview-v1.js?v=1' in league_page and 'sandbox-guard-v1.js?v=2' in league_page,
            'league canonical model loads': 'season-league-power-model-v2.js?v=2' in league_page and 'season-league-power-bars-v2.js?v=2' in league_page and 'season-league-power-bars-v1.js' not in league_page,
            'league overview uses Sleeper': all(x in league for x in ['/user/${encodeURIComponent(v)}','/leagues/nfl/${SEASON}','/league/${id}/rosters','/league/${id}/users']),
            'league overview saves user context': 'wh_sleeper_context_v1' in league and 'my_roster_id' in league and 'SET AS MY TEAM' in league,
            'league teams stack in one column': '.teams{display:grid;grid-template-columns:1fr' in league,
            'league full roster expands on team click': all(x in league for x in ['data-toggle-team','roster-panel','STARTERS','BENCH / DEPTH','VIEW FULL ROSTER']),
            'canonical power uses ros-led historical curves': 'const HIST=' in model and 'historicalPpg' in model and 'function rosBase(overallRank)' in model and 'function scarcityAdjustment(ctx,pos,posRank)' in model,
            'canonical power compresses elite end': '64+48*Math.exp(-.009' in model and 'Math.max(-4,Math.min(9,delta*.9))' in model,
            'canonical power builds best legal lineup': 'function bestLegalLineup' in model and "['RB','WR','TE']" in model and 'lineupRole' in model,
            'canonical power ignores current lineup': 'r.starters' not in model and '(r.players||[])' in model,
            'canonical power has diminishing depth': "[.30,.18,.10,.06,.04,.03]" in model and "p.posRank<=n?.03:.01" in model,
            'old explosive rank curve removed': '210*Math.exp(-.022' not in model and '100*Math.exp(-.085' not in model and 'EDGE_SCALE' not in model,
            'position bonus double count removed': 'const cap={QB:' not in model,
            'canonical bars are absolute and stable': 'state.scale.overall' in bars and 'max-width:96%!important' in bars and 'observe(teams,{childList:true,subtree:true})' not in bars,
            'canonical bars order best first': 'parent.appendChild(card)' in bars and 't.ranks.overall' in bars,
            'league audit exposes exact math': 'M.buildTeams(ctx())' in audit and 'HIST' in audit and 'ROLE' in audit and 'no separate position-rank bonus' in audit,
            'league is linked from tools': 'sandbox-league.html' in tools and 'League Overview' in tools,
            'trade links back to league': 'sandbox-league.html' in polish,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if failed: raise SystemExit('Sandbox checks failed: '+', '.join(failed))
          PY