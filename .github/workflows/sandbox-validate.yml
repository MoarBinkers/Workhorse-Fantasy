name: Validate Workhorse Sandbox

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production contracts remain intact
        run: |
          python .github/performance-regression-check.py
          python .github/release-contract-check.py
          python .github/live-draft-release-check.py
          node .github/rank-sync-regression-test.js

      - name: Check sandbox JavaScript syntax
        run: |
          for f in sandbox-guard-v1.js sandbox-admin-v1.js season-home-v1.js season-rankings-v3.js season-rankings-seed-v1.js season-rankings-enhance-v4.js season-rankings-ui-v5.js season-rankings-drag-v1.js season-player-detail-v1.js season-owner-control-v1.js season-insight-v3.js season-card-polish-v1.js season-ros-tiers-v4.js season-ros-change-fix-v1.js season-trade-calculator-v7.js season-trade-ui-polish-v1.js season-league-overview-v1.js season-league-intelligence-v1.js season-league-power-model-v2.js season-league-power-bars-v2.js season-league-card-details-v1.js season-league-power-audit-v1.js sandbox-tools-v1.js .github/power-model-sanity-test.js; do node --check "$f"; done

      - name: Check roster power sanity
        run: node .github/power-model-sanity-test.js

      - name: Verify current sandbox contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('sandbox.html').read_text()
          league_page=Path('sandbox-league.html').read_text()
          guard=Path('sandbox-guard-v1.js').read_text()
          owner=Path('season-owner-control-v1.js').read_text()
          model=Path('season-league-power-model-v2.js').read_text()
          bars=Path('season-league-power-bars-v2.js').read_text()
          audit=Path('season-league-power-audit-v1.js').read_text()
          trade=Path('season-trade-calculator-v7.js').read_text()
          static=Path('.github/workflows/static.yml').read_text()
          checks={
            'sandbox guard remains': 'sandbox_write_blocked' in guard,
            'production deploy remains main only': 'branches: ["main"]' in static,
            'owner editing survives rerenders': 'function attachRankObserver()' in owner and 'rankObserver.observe(observedBox' in owner,
            'trade calculator unchanged': 'function packageWeight(info,index,best)' in trade and 'REPL={QB:12,RB:30,WR:36,TE:12}' in trade,
            'league model loads': 'season-league-power-model-v2.js?v=2' in league_page and 'season-league-power-bars-v2.js?v=2' in league_page,
            'asset and lineup values are separated': 'function playerValue(ctx,pos,overallRank,posRank)' in model and 'function starterSlotValue(ctx,pos,overallRank,posRank)' in model,
            'overall ros still drives player value': 'function rosBase(overallRank)' in model and 'function scarcityAdjustment' in model,
            'starter top is capped and weak slots can fall': 'Math.max(58,Math.min(104,asset))' in model,
            'roster power uses best legal lineup': 'function bestLegalLineup' in model and 'b.lineupValue-a.lineupValue' in model,
            'roster power uses full roster': '(r.players||[])' in model and 'r.starters' not in model,
            'lower half meaningfully affects team gap': 'starterSum*.72' in model and 'lowerHalfAvg*values.length)*.28' in model and 'Math.max(.84' in model,
            'useful rb wr bench depth counts': "[.46,.32,.22,.14,.09,.055]" in model,
            'qb2 stays near zero in 1qb': "p.posRank<=n?.025:.008" in model and "index===1?.003:.001" in model,
            'bars stay bounded': 'max-width:96%!important' in bars and 'Math.min(96,pct)' in bars,
            'audit uses exact model': 'M.buildTeams(ctx())' in audit and 'ASSET' in audit and 'SLOT' in audit,
            'trade route remains': "v==='trade'" in page,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit(', '.join(failed))
          PY