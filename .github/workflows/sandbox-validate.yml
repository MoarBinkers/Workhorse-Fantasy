name: Validate Workhorse Sandbox

on:
  push:
    branches: ["sandbox"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workhorse-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox
        uses: actions/checkout@v4

      - name: Validate production contracts remain intact
        run: |
          python .github/performance-regression-check.py
          python .github/release-contract-check.py
          python .github/live-draft-release-check.py
          node .github/rank-sync-regression-test.js

      - name: Check sandbox JavaScript syntax
        run: |
          node --check sandbox-guard-v1.js
          node --check sandbox-admin-v1.js
          node --check season-home-v1.js
          node --check season-rankings-v3.js
          node --check season-rankings-seed-v1.js
          node --check season-rankings-enhance-v4.js
          node --check season-rankings-ui-v5.js
          node --check season-rankings-drag-v1.js
          node --check season-player-detail-v1.js
          node --check season-matchup-reference-v1.js
          node --check season-matchup-expanded-v1.js
          node --check season-injury-status-v1.js
          node --check season-owner-control-v1.js
          node --check season-insight-v2.js
          node --check season-compare-v1.js
          node --check season-matchup-trends-v1.js
          node --check season-regression-fix-v1.js
          node --check season-card-polish-v1.js
          node --check season-ros-tiers-v4.js
          node --check season-ros-change-fix-v1.js
          node --check sandbox-tools-v1.js
          node --check sandbox-rankings-loader-v2.js
          node --check sandbox-open-tool-v1.js
          node --check sandbox-return-home-v2.js

      - name: Verify sandbox product and stability contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('sandbox.html').read_text()
          guard=Path('sandbox-guard-v1.js').read_text()
          admin=Path('sandbox-admin-v1.js').read_text()
          home=Path('season-home-v1.js').read_text()
          season=Path('season-rankings-v3.js').read_text()
          seed=Path('season-rankings-seed-v1.js').read_text()
          enhance=Path('season-rankings-enhance-v4.js').read_text()
          ui=Path('season-rankings-ui-v5.js').read_text()
          drag=Path('season-rankings-drag-v1.js').read_text()
          detail=Path('season-player-detail-v1.js').read_text()
          matchup=Path('season-matchup-reference-v1.js').read_text()
          owner=Path('season-owner-control-v1.js').read_text()
          insight=Path('season-insight-v2.js').read_text()
          compare=Path('season-compare-v1.js').read_text()
          trends=Path('season-matchup-trends-v1.js').read_text()
          fix=Path('season-regression-fix-v1.js').read_text()
          tiers=Path('season-ros-tiers-v4.js').read_text()
          change=Path('season-ros-change-fix-v1.js').read_text()
          tools=Path('sandbox-tools-v1.js').read_text()
          legacy=Path('sandbox-rankings-loader-v2.js').read_text()
          checks={
            'sandbox page is noindex':'noindex,nofollow,noarchive' in page,
            'guard loads before sandbox app':'sandbox-guard-v1.js' in page,
            'season home remains default':'IN-SEASON MODE' in page and 'Latest fantasy news' in page,
            'PPR routes exist':all(x in page for x in ['view=ros','view=weekly','view=my-rankings']),
            'tools hub remains separate':'view=tools' in page and 'sandbox-tools-v1.js' in page,
            'home does not load legacy bundle':'app-v28.bin' not in page,
            'legacy bundle is click gated':'app-v28.bin' in legacy,
            'rankings have Sleeper headshots':'sleepercdn.com/content/nfl/players/thumb/' in season,
            'rankings fetch actual season stats':'/stats/nfl/regular/' in season and 'pts_ppr' in season,
            'master and personal stores separate':'wh_ros_master_v3' in season and 'wh_my_ros_v3' in season,
            'weekly boards separate by week':'wh_week_master_v3::' in season and 'wh_my_week_v3::' in season,
            'owner role protects master editing':'workhorse_role' in season and "==='owner'" in season,
            'live home injury/news feeds exist':'player_news' in home and 'sleeper_player_status' in home,
            'owner editor remains protected':'workhorse_role' in admin and "==='owner'" in admin and '#rank-rows' in admin,
            'production writes blocked':'sandbox_write_blocked' in guard,
            'sandbox storage namespaced':'wh_sandbox_v1::' in guard,
            'publish remains locked':'Production is locked' in admin and 'cannot publish to the live Workhorse site' in admin,
            'ranking enhancement loads after seed':'season-rankings-enhance-v4.js?v=3' in page and page.index('season-rankings-seed-v1.js?v=1') < page.index('season-rankings-enhance-v4.js?v=3'),
            'weekly caps preserved':"if(pos==='WR')return 75" in enhance and "if(pos==='RB')return 50" in enhance,
            'ROS caps preserved':"if(pos==='WR')return 100" in enhance and "if(pos==='RB')return 75" in enhance,
            'weekly semantic tiers preserved':all(x in enhance for x in ['Must Start','Great Start','Comfortable Flex','Shaky Flex']),
            'add player preserved':'+ Add Player' in enhance and 'wh-add-modal' in enhance,
            'enhancement has no global rerender observer':'observe(document.documentElement' not in enhance,
            'enhancement reacts only to direct row replacement':"observe(box,{childList:true,subtree:false})" in enhance and 'rowMutation' in enhance,
            'polished ranking UI remains':'data-overall-rank' in ui and 'data-pos-rank' in ui and 'border-radius:10px' in ui,
            'smooth drag remains pointer based':all(x in drag for x in ['pointerdown','pointermove','pointerup','setPointerCapture','wh-drag-ghost','wh-drop-line']),
            'smooth drag auto scrolls':'scrollLoop' in drag and 'scrollBy(0,speed)' in drag,
            'owner mode remains toggleable':'OWNER MODE · ON' in owner and 'OWNER MODE · OFF' in owner and 'wh-owner-control' in owner,
            'owner controls remain exact':'wh-owner-precision' in owner and 'data-up' in owner and 'data-down' in owner and 'data-rank' in owner,
            'player detail tabs preserved':all(x in detail for x in ['Overview','Game Log','Splits','Matchup','All Stats']),
            'player detail splits preserved':all(x in detail for x in ['Last 3','Last 5','Home','Away']),
            'weekly matchup uses schedule':'site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard' in detail,
            '2025 matchup reference is position specific':"REF_SEASON=2025" in matchup and "POSITIONS=['QB','RB','WR','TE']" in matchup and 'table[team][pos]' in matchup,
            'matchup colors preserved':all(x in matchup for x in ['wh-mu-chip.green','wh-mu-chip.yellow','wh-mu-chip.red']),
            '2025 last four matchup split preserved':all(x in trends for x in ['2025 Last 4','[15,16,17,18]','rankTotal']),
            'stable insights v2 loads':'season-insight-v2.js?v=2' in seed and 'data-wh-season-insight-v2' in seed,
            'role trends preserved':all(x in insight for x in ['Role trend','Targets','Carries','pass_att']),
            'editable Why Ranked preserved':all(x in insight for x in ['Why Ranked','wh-owner-note','Save rationale']),
            'rank history preserved':'wh_rank_history_v2::' in insight and 'historyDelta' in insight,
            'My vs Workhorse preserved':'vs WH' in insight and 'masterKey' in insight,
            'team environment preserved':'Game total' in insight and 'details' in insight,
            'smart search preserved':'Smart Search' in insight and 'TEAM_NAMES' in insight and 'Vikings WR' in insight,
            'insights have no timer driven card rewrite':'setInterval' not in insight,
            'insight row decoration observes direct children only':"observe(box,{childList:true,subtree:false})" in insight,
            'compare supports three players':'selected.size>=3' in compare and 'Player Comparison' in compare,
            'role trend regression guard preserved':'data-wh-role-for' in fix and 'removeBrokenRoleBlocks' in fix,
            'matchup recovery preserved':'matchupRecovery' in fix and '.wh-2025-ref' in fix,
            'ROS v4 tiers load':'season-ros-tiers-v4.js?v=4' in seed and 'window.__WH_ROS_TIERS_V4__' in seed,
            'ROS default tier cuts preserved':all(x in tiers for x in ['QB:[6,12,18]','RB:[12,24,48]','WR:[12,24,48]','TE:[6,12,18]']),
            'ROS tier assignments persist':'wh_ros_tiers_v1::' in tiers and 'assignment' in tiers,
            'ROS tier add controls exist':all(x in tiers for x in ['#wh-ros-add-tier','wh-ros-tier-picker','ADD NEXT TIER','data-add-tier-pos']),
            'ROS tiers carry into ALL':'wh-ros-tier-chip' in tiers and 'renderAll' in tiers,
            'ROS tier controller has no interval repaint':'setInterval' not in tiers,
            'ROS Change uses stable wrapper':'wh-change-wrap' in change and 'badge.textContent!==label' in change,
            'ROS Change has no global observer':'observe(document.documentElement' not in change,
            'ROS Change observes direct board children only':"observe(box,{childList:true,subtree:false})" in change,
            'main deploy workflow still targets main only':'branches: ["main"]' in Path('.github/workflows/static.yml').read_text(),
          }
          failed=[n for n,v in checks.items() if not v]
          for n,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+n)
          if failed: raise SystemExit('Sandbox checks failed: '+', '.join(failed))
          PY
