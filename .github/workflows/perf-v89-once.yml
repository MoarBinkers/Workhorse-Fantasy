name: Apply v89 performance patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-v89-once.yml'
      - '.github/perf-v89-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply performance patch
        run: python .github/perf-v89-patch.py
      - name: Syntax check changed scripts
        run: |
          node --check draft-room-v41.js
          node --check rankings-news-update-v83.js
          node --check sleeper-update-status-v40.js
          node --check cloud-reliability-v41.js
          node --check adp-movement-v49.js
          node --check new-user-adp-v60.js
          node --check decision-loader-v61.js
      - name: Run permanent performance guard
        run: python .github/performance-regression-check.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draft-room-v41.js rankings-news-update-v83.js sleeper-update-status-v40.js cloud-reliability-v41.js adp-movement-v49.js new-user-adp-v60.js decision-loader-v61.js index.html .github/performance-regression-check.py
          if git diff --cached --quiet; then
            echo "No production changes needed"
          else
            git commit -m "Reduce hidden startup and interaction work"
            git push
          fi
