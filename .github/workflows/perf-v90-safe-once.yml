name: Apply v90 safe loading patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-v90-safe-once.yml'
      - '.github/perf-v90-safe.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe loading patch
        run: python .github/perf-v90-safe.py
      - name: Syntax check protected runtime
        run: |
          node --check central-adp-v36.js
          node --check decision-loader-v61.js
          node --check rank-sync-v38.js
          node --check patch-v29.js
          node --check adp-movement-v49.js
          node --check live-draft-edge-v82.js
      - name: Run permanent performance and accuracy guard
        run: python .github/performance-regression-check.py
      - name: Verify critical invariants
        run: |
          grep -q 'scheduleRankingReconcile' central-adp-v36.js
          grep -q "workhorse:central-adp-ready',begin" decision-loader-v61.js
          grep -q 'requestIdleCallback(verifyInitialRanks' rank-sync-v38.js
          ! grep -q 'adp-unranked-label-v78.js' decision-loader-v61.js
          grep -q 'WorkhorseTrueSleeperAdpEntry' patch-v29.js
          grep -q 'WorkhorseTrueSleeperAdpEntry' live-draft-edge-v82.js
      - name: Commit production performance patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add central-adp-v36.js decision-loader-v61.js rank-sync-v38.js index.html .github/performance-regression-check.py
          if git diff --cached --quiet; then
            echo "No production changes needed"
          else
            git commit -m "Move noncritical work off ADP startup path"
            git push
          fi
