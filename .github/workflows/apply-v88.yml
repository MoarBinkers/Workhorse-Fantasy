name: Apply Workhorse top-250 on-demand player loading

on:
  push:
    paths:
      - '.github/workflows/apply-v88.yml'
      - 'apply-v88.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply top-250 startup loading v2
        run: python3 apply-v88.py
      - name: Validate JavaScript
        run: |
          node --check central-adp-v36.js
          node --check on-demand-player-search-v88.js
          git diff --check
      - name: Commit loading change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add central-adp-v36.js index.html
          git commit -m 'Load only top 250 players at startup'
          git push
