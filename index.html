<style>

<body>
<div class="loading"><div class="box"><div class="mark">WORKHORSE</div><div class="sub">Loading Fantasy Analytics…</div></div></div>
<script>
(async()=>{
 const fail=e=>{
  const m=String(e&&e.message?e.message:e).replace(/[&<>]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[s]));
  document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">WORKHORSE</div><div class="sub">The app could not start.</div><div class="err">'+m+'</div></div></div>';
 };
 try{
  const recoveryAtBoot=(()=>{
   try{
    const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
    const q=new URLSearchParams(location.search||'');
    const type=h.get('type')||q.get('type')||'';
    const marker=q.get('workhorse_recovery')==='1';
    const credential=h.get('access_token')||h.get('refresh_token')||q.get('code')||q.get('token_hash')||'';
    return (type==='recovery'||marker)&&!!credential;
   }catch(_){return false}
  })();
  if(recoveryAtBoot){
   window.__WORKHORSE_RECOVERY_PENDING__=true;
   window.__WORKHORSE_RECOVERY_BOOT_PROOF__=true;
   if(!window.__WORKHORSE_RECOVERY_FETCH_GUARD__){
    window.__WORKHORSE_RECOVERY_FETCH_GUARD__=true;
    const nativeFetch=window.fetch.bind(window);
    window.__WORKHORSE_NATIVE_FETCH__=nativeFetch;
    window.fetch=(input,init)=>{
     const target=typeof input==='string'?input:(input&&input.url)||'';
     if(window.__WORKHORSE_RECOVERY_PENDING__&&/^https:\/\/ytfwbvdzhrebupcftmhs\.supabase\.co\/(?:rest|functions|storage|realtime)\/v1\//i.test(target)){
      return Promise.resolve(new Response('{"message":"Account data is locked during password recovery."}',{status:423,headers:{'Content-Type':'application/json'}}));
     }
     return nativeFetch(input,init);
    };
   }
  }
  if(!("DecompressionStream" in window))throw new Error("Your browser needs an update to open Workhorse.");
  const bundle='./app-v28.bin?v=28d';
  const files=Array.from({length:10},(_,i)=>'./app-v28-part-'+String(i).padStart(2,'0')+'.bin?v=28c');
  const retryableStatuses=new Set([408,425,429,500,502,503,504]);
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const fetchAsset=async(file,maxAttempts=4)=>{
   let lastError=null;
   for(let attempt=0;attempt<maxAttempts;attempt++){
    try{
     const url=attempt===0?file:file+'&retry='+attempt+'-'+Date.now();
     const r=await fetch(url,{cache:attempt===0?"force-cache":"no-store"});
     if(r.ok)return new Uint8Array(await r.arrayBuffer());
     const err=new Error("Could not load "+file+" (HTTP "+r.status+").");
     err.status=r.status;
     lastError=err;
     if(!retryableStatuses.has(r.status))throw err;
    }catch(e){
     lastError=e;
     if(e&&e.status&&!retryableStatuses.has(e.status))throw e;
    }
    if(attempt<maxAttempts-1)await sleep(250*(2**attempt));
   }
   throw lastError||new Error("Could not load "+file+".");
  };
  const loadChunkFallback=async()=>{
    const buffers=new Array(files.length);
    let nextPart=0;
    const loadWorker=async()=>{
      while(true){
        const i=nextPart++;
        if(i>=files.length)return;
        buffers[i]=await fetchAsset(files[i],4);
      }
    };
    await Promise.all(Array.from({length:Math.min(3,files.length)},loadWorker));
    const total=buffers.reduce((n,b)=>n+b.length,0);
    if(total!==28016)throw new Error("Workhorse fallback bundle was incomplete ("+total+" bytes).");
    const joined=new Uint8Array(total);
    let offset=0;
    for(const b of buffers){joined.set(b,offset);offset+=b.length}
    return joined;
  };
  let joined;
  try{
    joined=await fetchAsset(bundle,2);
    if(joined.length!==28016)throw new Error("Workhorse bundle was incomplete ("+joined.length+" bytes).");
  }catch(bundleError){
    console.warn('Combined Workhorse bundle unavailable; using chunk fallback.',bundleError);
    joined=await loadChunkFallback();
  }
  const text=await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
  if(hash!=="77a31b87341147e99b00dbe40a23961addc39723cb8464129cc3c68a13db0879")throw new Error("Workhorse integrity check failed.");
  if(!text.startsWith("<!doctype html>")||!text.includes("DRAFT_EDGE_SUPABASE_URL")||!text.trim().endsWith("</html>"))throw new Error("Workhorse app file was incomplete.");

  let sourceBranded=text
    .replace(/DRAFT EDGE/g,'WORKHORSE')
    .replace(/Draft Edge/g,'Workhorse')
    .replace(/Rank\.\s*Draft\.\s*Dominate\.?/gi,'')
    .replace(/(?:\.\/)?assets\/draft-edge-logo\.webp/gi,'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=');

  // The verified central ADP module is authoritative. The compressed base still
  // contains an old full Sleeper-directory refresh using search_rank; do not
  // launch that request at boot because it can finish later and overwrite true ADP.
  sourceBranded=sourceBranded.replace('renderDraft();initSupabase();refreshCurrentAdp();','renderDraft();initSupabase();');
  // New lists made from the central pool should retain the built-in 2026 bye week
  // when the live ADP row itself does not carry schedule metadata.
  sourceBranded=sourceBranded.replace('bye:src.bye??"—"','bye:src.bye??(INITIAL.find(x=>norm(x.name)===norm(src.name))?.bye??"—")');

  // Only core functionality blocks startup. Everything else is loaded after verified Sleeper ADP.
  // defer lets these files download in parallel while preserving their dependency order.
  const patchTags="<scr"+"ipt defer src=\"./brand-fast-v92.js?v=922\"></scr"+"ipt><scr"+"ipt defer src=\"./patch-v29.js?v=298\"></scr"+"ipt><scr"+"ipt defer src=\"./tier-v33.js?v=335\"></scr"+"ipt><scr"+"ipt defer src=\"./player-detail-v34.js?v=344\"></scr"+"ipt><scr"+"ipt defer src=\"./central-adp-v92.js?v=921\"></scr"+"ipt><scr"+"ipt defer src=\"./mobile-touch-v75.js?v=753\"></scr"+"ipt><scr"+"ipt defer src=\"./cloud-reliability-v41.js?v=415\"></scr"+"ipt><scr"+"ipt defer src=\"./auth-recovery-v54.js?v=549\"></scr"+"ipt><scr"+"ipt defer src=\"./auth-forgot-popup-v56.js?v=566\"></scr"+"ipt><scr"+"ipt defer src=\"./auth-password-save-v57.js?v=574\"></scr"+"ipt><scr"+"ipt defer src=\"./new-user-adp-v60.js?v=610\"></scr"+"ipt><scr"+"ipt defer src=\"./decision-loader-v61.js?v=647\"></scr"+"ipt></body>";

  const preBrand='<style id="workhorse-prebrand">html:not(.workhorse-ready) body>*:not(#workhorse-app-gate){visibility:hidden!important}#workhorse-app-gate{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#0b1016;color:#eef3f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#workhorse-app-gate .wh-gate-box{text-align:center;padding:24px}#workhorse-app-gate .wh-gate-mark{font-size:30px;font-weight:1000;letter-spacing:-.04em}#workhorse-app-gate .wh-gate-sub{margin-top:8px;color:#8d9baa;font-size:13px}</style>';
  const recoveryCss='<style id="workhorse-recovery-boot-css">html.workhorse-recovery-lock body>*:not(#authGate):not(#deRecovery54){visibility:hidden!important}html.workhorse-recovery-lock #authGate,html.workhorse-recovery-lock #deRecovery54{visibility:visible!important}html.workhorse-recovery-lock #authGate{display:flex!important;opacity:1!important;pointer-events:auto!important;position:fixed!important;inset:0!important;z-index:2147483647!important;align-items:center!important;justify-content:center!important}</style>';
  const gate='<div id="workhorse-app-gate"><div class="wh-gate-box"><div class="wh-gate-mark">WORKHORSE</div><div class="wh-gate-sub">Loading Fantasy Analytics…</div></div></div>';
  let brandedText=sourceBranded;
  if(recoveryAtBoot)brandedText=brandedText.replace('<html','<html class="workhorse-recovery-lock"');
  brandedText=brandedText.replace("</head>",preBrand+(recoveryAtBoot?recoveryCss:'')+"</head>").replace("<body>","<body>"+gate);
  const app=brandedText.replace("</body>",patchTags);
  document.open();document.write(app);document.close();
 }catch(e){console.error(e);fail(e)}
})();
</script>
