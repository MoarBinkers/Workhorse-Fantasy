<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workhorse Sandbox — NOT LIVE</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
html,body{margin:0;min-height:100%;background:#0b1016;color:#eef3f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px}.box{text-align:center;max-width:720px}.badge{display:inline-block;background:#f2c96d;color:#07111b;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;letter-spacing:.08em;margin-bottom:14px}.mark{font-size:30px;font-weight:1000;letter-spacing:-.04em}.sub{margin-top:8px;color:#8d9baa;font-size:13px;line-height:1.55}.err{margin-top:14px;padding:12px 14px;border:1px solid #4a3340;border-radius:10px;background:#1c141a;color:#f3b6c2;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
</style>
<script src="./sandbox-guard-v1.js?v=1"></script>
</head>
<body>
<div class="loading"><div class="box"><div class="badge">SANDBOX · NOT LIVE</div><div class="mark">WORKHORSE</div><div class="sub">Loading the isolated Workhorse sandbox…</div></div></div>
<script>
(async()=>{
 const fail=e=>{
  const m=String(e&&e.message?e.message:e).replace(/[&<>]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[s]));
  document.body.innerHTML='<div class="loading"><div class="box"><div class="badge">SANDBOX · NOT LIVE</div><div class="mark">WORKHORSE</div><div class="sub">The sandbox could not start.</div><div class="err">'+m+'</div></div></div>';
 };
 try{
  if(!('DecompressionStream' in window))throw new Error('Your browser needs an update to open Workhorse.');
  const bundle='./app-v28.bin?v=28d';
  const files=Array.from({length:10},(_,i)=>'./app-v28-part-'+String(i).padStart(2,'0')+'.bin?v=28c');
  const fetchAsset=async(file)=>{const r=await fetch(file,{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+file+' (HTTP '+r.status+').');return new Uint8Array(await r.arrayBuffer())};
  let joined;
  try{joined=await fetchAsset(bundle);if(joined.length!==28016)throw new Error('bundle size')}catch(_){
    const buffers=await Promise.all(files.map(fetchAsset));
    const total=buffers.reduce((n,b)=>n+b.length,0);if(total!==28016)throw new Error('Workhorse fallback bundle was incomplete ('+total+' bytes).');
    joined=new Uint8Array(total);let off=0;for(const b of buffers){joined.set(b,off);off+=b.length}
  }
  const text=await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hash!=='77a31b87341147e99b00dbe40a23961addc39723cb8464129cc3c68a13db0879')throw new Error('Workhorse integrity check failed.');
  if(!text.startsWith('<!doctype html>')||!text.includes('DRAFT_EDGE_SUPABASE_URL')||!text.trim().endsWith('</html>'))throw new Error('Workhorse app file was incomplete.');

  let source=text
    .replace(/DRAFT EDGE/g,'WORKHORSE')
    .replace(/Draft Edge/g,'Workhorse')
    .replace(/Rank\.\s*Draft\.\s*Dominate\.?/gi,'')
    .replace(/(?:\.\/)?assets\/draft-edge-logo\.webp/gi,'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=');
  source=source.replace('renderDraft();initSupabase();refreshCurrentAdp();','renderDraft();initSupabase();');
  source=source.replace('bye:src.bye??"—"','bye:src.bye??(INITIAL.find(x=>norm(x.name)===norm(src.name))?.bye??"—")');

  const sandboxMeta='<meta name="robots" content="noindex,nofollow,noarchive"><script>window.__WORKHORSE_SANDBOX__=true;<\/script>';
  source=source.replace('</head>',sandboxMeta+'</head>');

  const patchTags='<script defer src="./brand-fast-v92.js?v=922"><\/script><script defer src="./patch-v29.js?v=300"><\/script><script defer src="./rank-sync-v38.js?v=400"><\/script><script defer src="./tier-v33.js?v=335"><\/script><script defer src="./central-adp-v92.js?v=921"><\/script><script defer src="./mobile-touch-v75.js?v=757"><\/script><script defer src="./cloud-reliability-v41.js?v=415"><\/script><script defer src="./auth-recovery-v54.js?v=549"><\/script><script defer src="./auth-forgot-popup-v56.js?v=566"><\/script><script defer src="./auth-password-save-v57.js?v=574"><\/script><script defer src="./new-user-adp-v60.js?v=610"><\/script><script defer src="./decision-loader-v61.js?v=660"><\/script><script defer src="./sandbox-admin-v1.js?v=1"><\/script></body>';
  const app=source.replace('</body>',patchTags);
  document.open();document.write(app);document.close();
 }catch(e){console.error(e);fail(e)}
})();
</script>
</body>
</html>
